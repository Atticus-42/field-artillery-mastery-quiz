<body>
  <script type="application/json" id="questions-easy">[{"id":1,"difficulty":"easy","category":"Mission and Functions","tags":["mission","timely and accurate support","integration of fire-support means"],"prompt":"During a Philippine Army brigade planning exercise, a draft artillery mission mentions timely, accurate fires for ground forces but omits the relationship with other fire-support means. Which addition best completes the mission described in the lesson?","options":["Assist in integrating all fire-support means into the combined-arms operation.","Limit artillery's contribution to its own weapon and ammunition combinations.","Make target acquisition the sole purpose of the combined-arms operation.","Replace fire-support integration with command of additional artillery units."],"answer":0,"explanation":"Slide 15 combines timely and accurate artillery support with assisting in the integration of all fire-support means into combined-arms operations.","sourceSlides":[15]},{"id":2,"difficulty":"easy","category":"Mission and Functions","tags":["functions","fire-support cells","fire-support elements"],"prompt":"A Philippine Army maneuver headquarters is organizing its fire-support cell for a training exercise. Which proposed artillery contribution matches the function assigned by the lesson?","options":["Provide a survey section in place of the maneuver headquarters' fire-support cell.","Assign the entire fire-support-cell function to the ammunition supply staff.","Establish the nucleus of the fire-support cell and provide fire-support elements to maneuver units.","Treat the fire-support cell as a target-acquisition collector only."],"answer":2,"explanation":"Slide 16 assigns artillery the function of establishing the nucleus of supported maneuver forces' fire-support cells and providing fire-support elements to maneuver units.","sourceSlides":[16]},{"id":3,"difficulty":"easy","category":"Tactical Roles","tags":["close support"],"prompt":"In a Philippine Army exercise review, an artillery action is described as engaging an enemy position that directly threatens the supported infantry during its advance. Which tactical role best describes that action?","options":["Attack at depth, because any support to an advance is interdiction.","Close support, because the enemy position threatens the supported force.","Counterfires, because any enemy position belongs to its fire-support system.","Diversion, because supporting an advance necessarily draws attention from another operation."],"answer":1,"explanation":"Slide 17 describes close support as engaging enemy troops, weapons, or positions that threaten or can threaten the force in attack or defense.","sourceSlides":[17]},{"id":4,"difficulty":"easy","category":"Tactical Roles","tags":["attack at depth","interdiction"],"prompt":"A Philippine Army exercise report describes artillery delaying an enemy force whose primary weapons cannot yet reach friendly troops because of intervening terrain. The delay creates a window for friendly maneuver. Which role is illustrated?","options":["Close support against a position already threatening the force with its primary weapons.","Counterfires directed at the enemy's overall fire-support system.","Diversion intended to draw enemy attention away from the principal operation.","Attack at depth, also called interdiction."],"answer":3,"explanation":"Slide 17 links attack at depth to enemy forces unable to use their primary weapons against friendly forces because of range or terrain, and to creating windows for friendly maneuver.","sourceSlides":[17]},{"id":5,"difficulty":"easy","category":"Tactical Roles","tags":["counterfires"],"prompt":"In a Philippine Army exercise review, a student rejects the label counterfires because the action addresses the enemy's wider fire-support system rather than its guns alone. Which judgment best corrects the student's reasoning?","options":["Retain counterfires: its purpose includes attacking the total enemy fire-support system.","Use close support: the label counterfires applies only to enemy guns.","Use interdiction: every action beyond enemy guns must be an attack at depth.","Use diversion: action against a wider system necessarily draws attention from the principal operation."],"answer":0,"explanation":"Slide 17 defines the purpose of counterfires as attacking the total enemy fire-support system throughout the battlefield.","sourceSlides":[17]},{"id":6,"difficulty":"easy","category":"Capabilities and Limitations","tags":["rapid shifting and massing"],"prompt":"In a Philippine Army map exercise, several targets are within the artillery weapons' specified range limits. A student claims that shifting and massing fires always requires moving the guns first. Which lesson-based correction is best?","options":["The claim is correct because mobility is a system element.","Artillery can shift and mass fires rapidly without having to displace.","The claim is correct because continuous support requires displacement before every shift.","Shifting fires depends on changing the weapon's caliber classification."],"answer":1,"explanation":"Slide 18 lists rapid shifting and massing of fires without displacement as a capability. The scenario states that the targets are within range, so it does not override the range limitation in slide 19.","sourceSlides":[18,19]},{"id":7,"difficulty":"easy","category":"Capabilities and Limitations","tags":["point-target ammunition cost"],"prompt":"During a Philippine Army training estimate, a planner assumes that destroying an individual point target will require little ammunition simply because artillery can mass fires rapidly. Which limitation most directly challenges that assumption?","options":["Artillery has limited self-defense against ground or air attack.","Artillery weapons must engage within their specified range limits.","Artillery firing signatures can reveal their presence.","Destroying point targets can require considerable ammunition expenditure."],"answer":3,"explanation":"Slide 19 specifically limits artillery's ability to destroy point targets without considerable ammunition expenditure. Rapid massing does not remove that limitation.","sourceSlides":[18,19]},{"id":8,"difficulty":"easy","category":"Capabilities and Limitations","tags":["weapon range limits","all-weather and all-terrain fires"],"prompt":"A Philippine Army student argues that the lesson's all-weather and all-terrain capability permits a weapon to engage a target beyond its specified range. Which assessment is supported by the lesson?","options":["The claim is valid because weather and terrain are the only limits on artillery fires.","The claim is valid whenever several weapons mass their fires.","The claim is invalid because each weapon still has specified range limits.","The claim is invalid because artillery cannot provide fires in poor weather."],"answer":2,"explanation":"Slides 18 and 19 state both the all-weather, all-terrain capability and the requirement to engage within specified weapon range limits. One does not cancel the other.","sourceSlides":[18,19]},{"id":9,"difficulty":"easy","category":"Weapon Classification","tags":["classification by caliber","medium"],"prompt":"A Philippine Army equipment clerk finds a 155 mm artillery weapon listed as heavy in a training inventory. Applying the lesson's caliber bands, which correction should the clerk make?","options":["Change the entry to light.","Retain the heavy classification.","Change the entry to very heavy.","Change the entry to medium."],"answer":3,"explanation":"Slide 20 places 121 mm through 160 mm weapons in the medium category. A 155 mm weapon belongs in that band.","sourceSlides":[20]},{"id":10,"difficulty":"easy","category":"Weapon Classification","tags":["classification by transport","self-propelled"],"prompt":"For a Philippine Army equipment briefing, a student labels an artillery weapon mounted on its own powered vehicle as towed merely because it travels by road. Which revision best follows the lesson's transport classification?","options":["Classify it as self-propelled because the weapon has its own powered mounting.","Keep it as towed because a vehicle supplies the power to move the mounted weapon.","List it as both towed and self-propelled because the gun and vehicle have separate functions.","Leave its transport class undecided until its next movement route is known."],"answer":0,"explanation":"Slides 21-24 distinguish towed, self-propelled, and aerial transport. Slide 23 illustrates a weapon mounted on a powered vehicle as self-propelled; road travel alone does not make it towed.","sourceSlides":[21,22,23,24]},{"id":11,"difficulty":"easy","category":"Effects of Fires","tags":["destroy","30-percent computed-effect threshold"],"prompt":"A Philippine Army simulation report labels an effect as neutralization, yet its evidence says the enemy unit remains physically combat-ineffective until reconstituted. Which effect should replace the report's label?","options":["Suppress.","Neutralize.","Destroy.","Diversion."],"answer":2,"explanation":"Slide 25 describes destruction as physically rendering a force combat-ineffective until reconstituted. Its computed artillery effect is permanent or long-term ineffectiveness with at least 30-percent casualties or materiel damage.","sourceSlides":[25]},{"id":12,"difficulty":"easy","category":"Effects of Fires","tags":["neutralize","10-percent computed-effect threshold"],"prompt":"A Philippine Army exercise report records that opposing troops stopped firing while a friendly movement was completed, then resumed shortly afterward. The report concludes that the opposing force was permanently destroyed. Which correction is supported by the recorded results?","options":["Retain destruction: completion of the friendly movement establishes a permanent effect.","Record neutralization for that operation: the later resumption does not support permanent destruction.","Record diversion: the temporary halt establishes that enemy attention shifted elsewhere.","Record disruption: the temporary halt establishes that enemy forces committed piecemeal."],"answer":1,"explanation":"The troops did not interfere during the recorded movement, but resumed firing afterward. That supports the operation-specific, temporary effect of neutralization in slide 26 rather than permanent destruction. Slide 26's computed-effect threshold is at least 10-percent casualties or materiel damage; the report does not provide a casualty estimate.","sourceSlides":[26]},{"id":13,"difficulty":"easy","category":"Effects of Fires","tags":["suppress","3-percent computed-effect threshold"],"prompt":"A Philippine Army training report claims destruction, but the evidence shows only a temporary drop in an enemy weapon system's performance below the level needed for its mission. Which effect is supported by that evidence?","options":["Suppress.","Destroy.","Defeat.","Diversion."],"answer":0,"explanation":"Slide 27 describes suppression as temporary degradation of performance below the level needed for the mission. Its computed effect uses at least 3-percent casualties or materiel damage; this is not a guarantee of physical destruction.","sourceSlides":[27]},{"id":14,"difficulty":"easy","category":"Effects of Fires","tags":["disrupt"],"prompt":"In a Philippine Army map exercise, the described result of combining fires, terrain, and obstacles is that the enemy's timetable breaks down and its force commits piecemeal. Which effect best describes this result?","options":["Diversion, because enemy attention was drawn away from the principal operation.","Defeat, because the enemy necessarily lost the means or will to fight.","Destroy, because a broken timetable proves long-term physical ineffectiveness.","Disrupt, because the enemy's tempo and orderly commitment were upset."],"answer":3,"explanation":"Slide 28 links disruption to integrating direct and indirect fires, terrain, and obstacles to upset formation or tempo, interrupt the timetable, or cause premature or piecemeal commitment.","sourceSlides":[28]},{"id":15,"difficulty":"easy","category":"Philippine Operational Environment","tags":["Philippine archipelago","rapid displacement between islands"],"prompt":"A Philippine Army staff exercise expands from one island to another, but its mobility review considers movement within a single land area only. Which correction best addresses the gap in the review?","options":["Measure rapid movement between positions on the original island as proof of inter-island readiness.","Include rapid movement between islands while maintaining continuity of the ongoing operation.","Add inter-island travel speed as the requirement, leaving operational interruptions outside the review.","Require artillery to remain on the original island until operations there have completely ended."],"answer":1,"explanation":"Slide 29 says the Philippine archipelago and its distinct land features require artillery capable of rapid displacement between areas or islands without disrupting multidimensional operations.","sourceSlides":[29]},{"id":16,"difficulty":"easy","category":"Philippine Operational Environment","tags":["Philippine archipelago","continuity during displacement"],"prompt":"An after-action review of a Philippine Army island-to-island exercise praises a rapid artillery move, although the move disrupted the ongoing operation. How should the review assess this against the lesson's environmental requirement?","options":["Fully satisfactory, because displacement speed is the only stated requirement.","Fully satisfactory, because continuity applies only to movement within one land area.","Incomplete, because rapid displacement must also avoid disrupting the operation.","Incomplete only if the destination island requires a different tactical role."],"answer":2,"explanation":"Slide 29 couples rapid displacement with avoiding disruption to multidimensional operations. Speed alone does not satisfy that stated requirement.","sourceSlides":[29]},{"id":17,"difficulty":"easy","category":"Four Basic Tasks","tags":["support forces in contact"],"prompt":"During a Philippine Army exercise review, the supported unit reports that artillery support was not ready when requested while the unit was in contact. Which basic task is most directly at issue?","options":["Support the concept of operations, judged only by the commander's overall objective.","Synchronize fire support, judged only by coordination among different assets.","Support forces in contact, which requires responsive fires ready when requested.","Sustain FA operations, judged only by keeping the artillery unit supplied."],"answer":2,"explanation":"Slide 31 states that support to forces in contact requires responsive artillery fires ready when requested by the supported unit. The report identifies readiness to respond, not a specific supply or coordination failure.","sourceSlides":[31]},{"id":18,"difficulty":"easy","category":"Four Basic Tasks","tags":["support the concept of operations"],"prompt":"A Philippine Army exercise review finds that artillery fires were timely but served an objective unrelated to the supported maneuver commander's objective. Which basic task was missed?","options":["Support the concept of operations.","Support forces in contact, solely because the fires were timely.","Sustain FA operations, solely because an objective was selected.","Synchronize fire support, solely because artillery was employed."],"answer":0,"explanation":"Slide 31 requires artillery fires to fulfill the supported maneuver commander's objective under support to the concept of operations. Timeliness alone does not establish that alignment.","sourceSlides":[31]},{"id":19,"difficulty":"easy","category":"Four Basic Tasks","tags":["synchronize fire support","economize resources"],"prompt":"A Philippine Army exercise staff finds that available fire-support assets acted without coordination and duplicated effort. The corrective goal is to economize resources while maximizing their combined effect. Which basic task addresses that goal?","options":["Sustain FA operations by focusing only on artillery resupply.","Support forces in contact by focusing only on response readiness.","Support the concept of operations by focusing only on naming the commander's objective.","Synchronize fire support with the other available assets."],"answer":3,"explanation":"Slide 31 assigns synchronization the purpose of coordinating artillery with other available fire-support assets to economize resources and maximize effect.","sourceSlides":[31]},{"id":20,"difficulty":"easy","category":"FA System Elements and Responsibilities","tags":["target acquisition","observers and collectors","drones and vertical imagery","FA intelligence"],"prompt":"In a Philippine Army training review, observer reports and drone imagery are available, but the resulting target information lacks timely identification and location. Which system element's core responsibility most directly concerns that gap?","options":["Logistics, through sustaining artillery operations.","Target acquisition, through detection, identification, and location of targets.","Weapon/ammunition combinations, through matching weapons and ammunition.","Mobility, through providing movement assets."],"answer":1,"explanation":"Slide 33 makes timely, accurate detection, identification, and location the responsibility of target acquisition. It includes artillery observers and vertical aerial imagery such as drones among information collectors for artillery intelligence.","sourceSlides":[33]},{"id":21,"difficulty":"easy","category":"FA System Elements and Responsibilities","tags":["fire direction center","call-for-fire conversion"],"prompt":"A Philippine Army observer's call for fire reaches the training headquarters, but it has not been converted into appropriate fire commands. Which element has the responsibility for that conversion?","options":["The target-acquisition collectors.","The survey section.","The logistics element.","The fire direction center."],"answer":3,"explanation":"Slide 34 explicitly assigns the fire direction center the conversion of a forward observer's call for fire into appropriate fire commands.","sourceSlides":[34]},{"id":22,"difficulty":"easy","category":"FA System Elements and Responsibilities","tags":["survey","common survey grid","Headquarters and Headquarters Battery"],"prompt":"A Philippine Army exercise review identifies inconsistent location and direction references among artillery elements. Which system function provides the common grid needed to resolve that specific inconsistency?","options":["Ballistic meteorology.","Weapon/ammunition combinations.","Survey.","Logistics."],"answer":2,"explanation":"Slide 36 states that artillery survey provides a common grid of location and direction for accurate delivery and massing of fires. The survey section belongs to Headquarters and Headquarters Battery.","sourceSlides":[36]},{"id":23,"difficulty":"easy","category":"FA System Elements and Responsibilities","tags":["communications","radio and digital communications","Signal Platoon","Headquarters and Headquarters Battery"],"prompt":"During a Philippine Army communications exercise, unreliable voice and digital radio links delay exchanges even though the participating staff have completed their work. Which system element is most directly responsible for the reliability issue described?","options":["Communications.","Ballistic meteorology.","Survey.","Weapon/ammunition combinations."],"answer":0,"explanation":"Slide 37 links artillery effectiveness and responsiveness to efficient, reliable communications and identifies radio for voice and digital use as the principal means. The Signal Platoon is under Headquarters and Headquarters Battery.","sourceSlides":[37]},{"id":24,"difficulty":"easy","category":"Employment Tactics and Integrated Decisions","tags":["employment tactics","offensive positioning"],"prompt":"In a Philippine Army map-exercise review, artillery is described as positioned well forward to support an attack and exploit weapon range. Which explanation best matches the lesson's reason for this broad employment pattern?","options":["It applies the defensive rationale of preserving fires after enemy penetration to a forward position.","It follows the supported unit's offensive mission by supporting the attack and exploiting weapon range.","It treats exploiting weapon range as sufficient reason for the same forward posture in offense and defense.","It treats proximity to the supported unit as the requirement for continuity of fires in every mission."],"answer":1,"explanation":"Slide 38 says the supported unit's mission dictates artillery employment. It associates well-forward positioning to support an attack and exploit range with the offense.","sourceSlides":[38]},{"id":25,"difficulty":"easy","category":"Employment Tactics and Integrated Decisions","tags":["employment tactics","defensive positioning","continuity of fires"],"prompt":"A Philippine Army student reviews a defensive exercise diagram in which supporting artillery is positioned to the rear. Which stated rationale most closely follows the lesson?","options":["Maintaining continuity of artillery fires if the enemy penetrates.","Exploiting range from a well-forward position during an attack.","Removing the need for target acquisition during the defense.","Making the artillery's limited self-defense capability irrelevant."],"answer":0,"explanation":"Slide 38 links rearward positioning in defense to continuity of artillery fires in the event of enemy penetration. It does not remove other system requirements or limitations.","sourceSlides":[38]}]</script>
  <script type="application/json" id="questions-medium">[{"id":1,"difficulty":"medium","category":"Mission and Functions","tags":["mission","timely and accurate support","integration of fire-support means"],"prompt":"Two Philippine Army exercise teams dispute a mission assessment. Team A reports accurate artillery support but no integration with other fire-support means. Team B reports successful integration but artillery support that arrived too late. Which assessment applies the whole mission in the lesson?","options":["Team A met the mission because accuracy compensates for missing integration.","Both have a mission gap: integration and timely, accurate support are required together.","Team B met the mission because integration compensates for late artillery support.","Both met the mission because each fulfilled a separate, sufficient part of it."],"answer":1,"explanation":"Slide 15 joins timely, accurate fires in support of ground forces with assistance in integrating all fire-support means. Neither report establishes both parts of that mission.","sourceSlides":[15]},{"id":2,"difficulty":"medium","category":"Mission and Functions","tags":["functions","fire-support cells","fire-support elements","command and control of additional artillery"],"prompt":"In a Philippine Army headquarters exercise, artillery personnel form the maneuver fire-support cell and provide its fire-support elements. Additional artillery units then join, but no arrangement is made to command and control them. A reviewer says the completed cell work covers the new requirement. Which finding is best?","options":["Accept the finding because fire-support-cell formation replaces command of additional artillery.","Reject the cell arrangement because additional artillery eliminates the need for maneuver fire-support elements.","Record only a target-acquisition gap because additional units are information collectors.","Credit the cell work while recording a separate command-and-control gap for the additional units."],"answer":3,"explanation":"Slide 16 lists forming fire-support cells and providing fire-support elements separately from commanding and controlling additional field artillery units. Completing one function does not demonstrate the other.","sourceSlides":[16]},{"id":3,"difficulty":"medium","category":"Tactical Roles","tags":["close support","attack at depth","interdiction"],"prompt":"A Philippine Army exercise log labels two actions as close support. The first addresses troops currently threatening the supported force. The second delays a separate force whose primary weapons cannot reach friendly troops because of terrain, creating a maneuver window. Which revision best distinguishes their roles?","options":["Retain close support for the first; change the second to attack at depth.","Change the first to counterfires; retain close support for the second.","Retain close support for both because both benefit friendly maneuver.","Change both to attack at depth because both address enemy troops."],"answer":0,"explanation":"Slide 17 distinguishes close support against threats to the force from attack at depth against forces unable to use their primary weapons on friendly forces because of range or terrain. The second action also has the stated maneuver-window purpose.","sourceSlides":[17]},{"id":4,"difficulty":"medium","category":"Tactical Roles","tags":["attack at depth","interdiction","weapon range limits"],"prompt":"In a Philippine Army tabletop review, a depth-fire scenario places the enemy beyond the reach of its own primary weapons but within the supporting artillery's specified range. A student rejects the scenario because 'the lesson says the enemy is out of range.' Which interpretation resolves the apparent contradiction?","options":["Attack at depth exempts the supporting artillery from its own range limits.","Any enemy outside its own weapon range must instead be classified as a counterfire target.","Enemy inability to reach friendly forces and artillery ability to reach the enemy are separate range questions.","The scenario must be close support because the supporting artillery can reach the enemy."],"answer":2,"explanation":"Slide 17's depth role concerns the enemy primary weapon's inability to fire on friendly forces. Slide 19 separately limits supporting artillery to its own specified weapon range. Both conditions can hold at once.","sourceSlides":[17,19]},{"id":5,"difficulty":"medium","category":"Tactical Roles","tags":["counterfires","disrupt"],"prompt":"A Philippine Army exercise report describes fires intended against the total enemy fire-support system and records a disruption of its timetable. One reviewer labels the tactical role 'disrupt'; another labels it 'counterfires.' Which entry keeps role and effect distinct?","options":["Use disruption as the role and counterfires as the effect because the timetable changed.","Use counterfires as the role and disruption as the reported effect.","Use attack at depth as the role because any timetable disruption proves a depth engagement.","Use close support as the role because any attack on fire support proves a direct threat to friendly troops."],"answer":1,"explanation":"Slide 17 defines counterfires by their intent against the total enemy fire-support system. Slide 28 includes interrupting the enemy timetable under disruption. An effect does not replace the role classification.","sourceSlides":[17,28]},{"id":6,"difficulty":"medium","category":"Capabilities and Limitations","tags":["all-weather and all-terrain fires","limited self-defense"],"prompt":"During a Philippine Army classroom exercise, a readiness card reports that a battery can provide fires in adverse weather and varied terrain. Its reviewer also credits it with strong self-defense against ground and air attack, citing that same capability. Which correction preserves what the lesson actually supports?","options":["Keep the weather-and-terrain capability, but assess self-defense separately as a stated limitation.","Keep both findings because the ability to provide fires establishes the ability to defend the firing unit.","Remove both findings because limited self-defense also prevents fires in adverse weather.","Replace the self-defense finding with a range finding because both describe the same limitation."],"answer":0,"explanation":"Slide 18 states the all-weather, all-terrain fire capability. Slide 19 independently identifies limited self-defense against ground or air attack. The first statement supplies no basis for reversing the second.","sourceSlides":[18,19]},{"id":7,"difficulty":"medium","category":"Capabilities and Limitations","tags":["shell/fuze variety","point-target ammunition cost","weapon/ammunition combinations"],"prompt":"A Philippine Army exercise estimate credits an appropriate shell-and-fuze choice with improving effectiveness, then assumes that every point target can therefore be destroyed with little ammunition. Which review comment correctly relates the capability to the limitation?","options":["Reject shell-and-fuze choice as relevant because ammunition expenditure is the only consideration in the lesson.","Accept the estimate because any suitable combination removes the point-target limitation.","Attribute the likely ammunition expenditure solely to weapon range, since the target type is irrelevant.","Credit the suitable combination, but retain the limitation that point-target destruction can require considerable ammunition."],"answer":3,"explanation":"Slides 18 and 35 support variety and suitable weapon/ammunition combinations. Slide 19 still limits the ability to destroy point targets without considerable ammunition expenditure; suitability is not a promise of low expenditure.","sourceSlides":[18,19,35]},{"id":8,"difficulty":"medium","category":"Capabilities and Limitations","tags":["rapid shifting and massing","detectable firing signature"],"prompt":"A Philippine Army simulation successfully shifts and masses fires without moving the weapons. The summary then states that remaining stationary also prevents detection because no movement was observed. Which assessment best separates the demonstrated capability from the unsupported conclusion?","options":["Reject the entire summary because shifting fires always requires displacement.","Accept the entire summary because an absence of movement means an absence of an artillery signature.","Accept the shifting-and-massing result, but reject the detection claim because firing itself has a detectable signature.","Accept the detection claim, but reject massing because only a single weapon can fire without displacement."],"answer":2,"explanation":"Slide 18 permits rapid shifting and massing without displacement. Slide 19 says artillery has a firing signature vulnerable to enemy target acquisition; lack of movement does not establish lack of that signature.","sourceSlides":[18,19]},{"id":9,"difficulty":"medium","category":"Weapon Classification","tags":["classification by caliber","light","medium","heavy","very heavy"],"prompt":"In a Philippine Army training inventory, a 120 mm example is marked medium and a 211 mm example is marked heavy. A clerk argues that each is near a boundary, so either adjacent category is acceptable. Which audit correction applies the lesson's boundaries consistently?","options":["Mark 120 mm as light and 211 mm as very heavy; each falls within an explicitly stated band.","Retain medium and heavy; boundary values belong to the lower-numbered band in each case.","Mark 120 mm as light but retain 211 mm as heavy; only the light band includes a boundary value.","Retain 120 mm as medium but mark 211 mm as very heavy; only the very-heavy band includes a boundary value."],"answer":0,"explanation":"Slide 20 sets light at 120 mm and less, medium at 121-160 mm, heavy at 161-210 mm, and very heavy at 211 mm and more. Proximity to a boundary does not make either given entry optional.","sourceSlides":[20]},{"id":10,"difficulty":"medium","category":"Weapon Classification","tags":["classification by caliber","classification by transport","medium","towed","self-propelled"],"prompt":"A Philippine Army classroom inventory contains two 155 mm examples: one towed and one self-propelled. A student assigns different caliber categories because their transport arrangements differ. Which paired entry uses the lesson's two classification systems correctly?","options":["Light/towed and medium/self-propelled, because powered transport raises the caliber class.","Medium/towed for both, because identical caliber requires identical transport classification.","Medium/towed and medium/self-propelled, because caliber and means of transport are separate classifications.","Medium/towed and heavy/self-propelled, because a powered mounting makes a weapon heavy."],"answer":2,"explanation":"Slide 20 places both 155 mm examples in the medium caliber band. Slide 21 separately classifies means of transport, so the supplied towed and self-propelled descriptions remain different.","sourceSlides":[20,21]},{"id":11,"difficulty":"medium","category":"Effects of Fires","tags":["destroy","neutralize","suppress","30-percent computed-effect threshold","10-percent computed-effect threshold","3-percent computed-effect threshold"],"prompt":"A Philippine Army worksheet assigns the lesson's minimum computed-effect thresholds as destroy 10 percent, neutralize 30 percent, and suppress 3 percent. Its explanation correctly distinguishes long-term destruction from short-term ineffectiveness. Which edit makes the numbers consistent with that explanation and the lesson?","options":["Retain all three numbers because duration alone determines the stated percentage thresholds.","Change suppression to 10 percent and keep the other two entries.","Change destruction to 3 percent and suppression to 10 percent.","Exchange the destruction and neutralization entries, producing 30, 10, and 3 percent respectively."],"answer":3,"explanation":"Slides 25-27 give at least 30 percent for computed destruction, 10 percent for neutralization, and 3 percent for suppression. These are the lesson's casualty-or-materiel-damage thresholds, alongside its separate descriptions of the effects.","sourceSlides":[25,26,27]},{"id":12,"difficulty":"medium","category":"Effects of Fires","tags":["neutralize","suppress","10-percent computed-effect threshold","3-percent computed-effect threshold"],"prompt":"A Philippine Army simulation records temporary degradation of a weapon system below mission performance and a computed 5-percent materiel-damage estimate. A reviewer labels it neutralization solely because both neutralization and suppression are short-term effects. Which finding best applies the stated evidence?","options":["Retain computed neutralization because any short-term effect meets its threshold.","Support suppression: the described degradation and estimate fit it, while 5 percent does not meet the computed neutralization minimum.","Support destruction because any measured materiel damage establishes long-term ineffectiveness.","Reject suppression because the lesson requires exactly 3 percent, rather than at least 3 percent."],"answer":1,"explanation":"Slide 27 describes temporary degradation below mission performance and a computed threshold of at least 3 percent. Five percent exceeds that minimum but is below slide 26's 10-percent minimum for computed neutralization.","sourceSlides":[26,27]},{"id":13,"difficulty":"medium","category":"Effects of Fires","tags":["destroy","neutralize","30-percent computed-effect threshold"],"prompt":"In a Philippine Army exercise, a report records a 30-percent casualty-or-damage estimate but says the opposing force resumed effective activity after a short interruption. Its conclusion is 'permanent destruction proven.' Which review is most defensible from the lesson?","options":["Accept the conclusion because reaching 30 percent proves permanent ineffectiveness regardless of the observed recovery.","Flag the conclusion: the numerical destruction minimum is reached, but the observed short interruption does not establish its permanent or long-term effect.","Reject the numerical comparison because the lesson's destruction minimum is 10 percent.","Relabel the action diversion because recovery after a short interruption proves a shift in attention."],"answer":1,"explanation":"Slide 25 describes destruction as permanent or long-term ineffectiveness and gives a minimum computed threshold of 30 percent. The threshold alone does not justify ignoring contrary duration evidence; slide 26 describes short-term ineffectiveness.","sourceSlides":[25,26]},{"id":14,"difficulty":"medium","category":"Effects of Fires","tags":["disrupt","defeat","diversion"],"prompt":"Two Philippine Army exercise reports claim defeat. Report X shows enemy attention and forces drawn away from the principal operation. Report Y shows an interrupted timetable and piecemeal commitment. Neither records a loss of the means or will to fight. Which review best distinguishes the evidence?","options":["X supports diversion and Y supports disruption; neither stated result by itself establishes defeat.","X supports disruption and Y supports diversion; both establish defeat without further evidence.","Both support defeat because any change in enemy behavior proves a loss of the will to fight.","Both support destruction because diverted or delayed forces must be reconstituted before fighting."],"answer":0,"explanation":"Slide 28 distinguishes diversion of attention and forces, disruption of timetable or orderly commitment, and defeat through loss of the physical means or will to fight. The reports establish the first two effects, not the third.","sourceSlides":[28]},{"id":15,"difficulty":"medium","category":"Philippine Operational Environment","tags":["Philippine archipelago","rapid displacement between islands","continuity during displacement","classification by transport"],"prompt":"A Philippine Army island-movement exercise gives one team a high readiness score merely for listing an aerial transport arrangement. Another team is assessed on both displacement speed between islands and continuity of the wider operation. Which scoring basis better matches the lesson?","options":["The first, because naming a transport category proves the operational movement requirement is met.","Neither, because the lesson's environmental requirement applies only within one island.","The second, because transport classification alone does not demonstrate rapid displacement without disrupting operations.","Both equally, because an aerial classification and uninterrupted rapid displacement are equivalent evidence."],"answer":2,"explanation":"Slide 21 lists transport categories, while slide 29 requires rapid movement between areas or islands without disrupting multidimensional operations. A category name alone does not establish that performance.","sourceSlides":[21,29]},{"id":16,"difficulty":"medium","category":"Philippine Operational Environment","tags":["Philippine archipelago","mobility","mobility assets","logistics","sustain FA operations"],"prompt":"In a Philippine Army inter-island exercise review, movement assets deliver the artillery unit promptly, but a documented supply interruption prevents it from continuing its assigned support. The reviewer marks both mobility and sustainment successful because the move finished. Which paired assessment is supported?","options":["Both succeeded because arrival establishes the ability to sustain subsequent operations.","Both failed because any later supply interruption proves that transport was late.","Sustainment succeeded, but mobility failed because resupply and movement are the same system element.","Movement was timely, but logistics and sustainment remain deficient; arrival alone does not establish operational continuity."],"answer":3,"explanation":"Slide 29 couples rapid displacement with uninterrupted operations. Slides 31 and 37 separately require sustainment and describe logistics as sustaining artillery operations, so timely arrival does not resolve the documented supply gap.","sourceSlides":[29,31,37]},{"id":17,"difficulty":"medium","category":"Four Basic Tasks","tags":["support forces in contact","support the concept of operations"],"prompt":"A Philippine Army staff compares two exercise records. Record A shows fires ready when a unit in contact requested them, but serving the wrong maneuver objective. Record B shows an appropriate objective, but fires unavailable when requested. Which feedback identifies the contrasting task gaps?","options":["A lacks support to forces in contact; B lacks support to the concept of operations.","A lacks alignment with the concept of operations; B lacks responsive support to forces in contact.","Both records establish all basic tasks because one demonstrates timeliness and the other an appropriate objective.","Both records establish a sustainment failure even though neither identifies a sustainment problem."],"answer":1,"explanation":"Slide 31 distinguishes readiness to respond to a supported unit in contact from fulfilling the maneuver commander's objective. A meets the stated readiness criterion but misses the objective; B has the opposite documented gap.","sourceSlides":[31]},{"id":18,"difficulty":"medium","category":"Four Basic Tasks","tags":["synchronize fire support","sustain FA operations","economize resources"],"prompt":"A Philippine Army exercise review lists two problems: different fire-support assets duplicated effort, and an artillery unit could not sustain its operations. The draft correction assigns both to synchronization. Which revision best preserves the lesson's distinction between basic tasks?","options":["Assign both to sustainment because any use of resources is a logistics matter.","Keep both under synchronization because sustaining a unit and coordinating assets are identical tasks.","Assign the first only to support of forces in contact and the second only to support of the concept of operations.","Address duplication through synchronization and the unit's continued operation through sustainment."],"answer":3,"explanation":"Slide 31 links synchronization with other available fire-support assets to economy and maximum effect. It separately requires commanders to sustain artillery units. One task label should not erase the other documented problem.","sourceSlides":[31]},{"id":19,"difficulty":"medium","category":"Four Basic Tasks","tags":["sustain FA operations","support forces in contact","logistics"],"prompt":"A Philippine Army exercise unit responds promptly to its first request, then loses the ability to continue because its logistics support cannot sustain operations. The assessment credits the initial response as proof that every basic task was satisfied. Which conclusion best fits the sequence?","options":["Credit the initial responsive support, but record a subsequent sustainment failure that the first response cannot cancel.","Credit every basic task because one timely response proves continued readiness for the whole exercise.","Remove credit for the initial response because a later supply failure makes that response untimely.","Record only a synchronization failure because any inability to continue proves duplication among fire-support assets."],"answer":0,"explanation":"Slide 31 requires both responsive support and sustainment; slide 37 identifies logistics as supporting continued operations. Success on the first request does not prove that the separate sustainment task was fulfilled afterward.","sourceSlides":[31,37]},{"id":20,"difficulty":"medium","category":"FA System Elements and Responsibilities","tags":["target acquisition","observers and collectors","drones and vertical imagery","FA intelligence","fire direction center","call-for-fire conversion"],"prompt":"A Philippine Army training log confirms timely detection, identification, and location from observers and drone imagery. The resulting call for fire reaches the fire direction center unchanged, but no appropriate fire commands emerge. Which diagnosis identifies the failed link without blaming a completed upstream function?","options":["Target acquisition failed because collectors are responsible for converting the call into fire commands.","Mobility failed because the absence of commands proves the unit could not move.","Call-for-fire conversion failed at fire direction, despite successful acquisition and delivery of the call.","Communications failed because any absence of fire commands proves the call was not delivered."],"answer":2,"explanation":"Slide 33 assigns detection, identification, and location to target acquisition, including observers and aerial imagery as collectors. Slide 34 assigns conversion of the received call into fire commands to the fire direction center. The log locates the break at that conversion.","sourceSlides":[33,34]},{"id":21,"difficulty":"medium","category":"FA System Elements and Responsibilities","tags":["communications","radio and digital communications","Signal Platoon","Headquarters and Headquarters Battery","fire direction center"],"prompt":"In a Philippine Army communications drill, reviewers confirm that the fire direction center produced appropriate commands, but unreliable voice and digital radio links prevented their receipt. A proposed remedy is to repeat the command-conversion work. Which diagnosis better follows the recorded chain?","options":["The conversion function failed, because nonreceipt proves the commands were never produced.","The communications link failed; the Signal Platoon belongs to Headquarters and Headquarters Battery, while the recorded conversion was completed.","The survey function failed, because voice and digital radio reliability establishes the common location grid.","The target-acquisition function failed, because transmitting completed commands is the collectors' defining responsibility."],"answer":1,"explanation":"Slide 34 assigns conversion to the fire direction center. Slide 37 ties responsiveness to reliable communications, identifies voice and digital radio as principal means, and places the Signal Platoon under Headquarters and Headquarters Battery. The log distinguishes production from transmission.","sourceSlides":[34,37]},{"id":22,"difficulty":"medium","category":"FA System Elements and Responsibilities","tags":["survey","common survey grid","ballistic meteorology","five requirements for accurate predicted fires","Headquarters and Headquarters Battery"],"prompt":"A Philippine Army accuracy review finds that all elements share a verified grid of location and direction, but required meteorological information is absent. A student proposes repeating survey and marking all requirements for accurate predicted fires complete. Which assessment best separates the two functions?","options":["Accept the proposal because a common survey grid supplies the missing meteorological information.","Reject the existing survey result because absent meteorology proves the grid is inconsistent.","Credit the common grid, but retain the meteorological gap; survey does not replace this separate requirement for accurate predicted fires.","Mark all requirements complete because the lesson treats meteorological information as optional when survey is available."],"answer":2,"explanation":"Slide 36 gives survey the common-grid function and identifies MET information as one of five requirements for accurate predicted fires. Both sections belong to Headquarters and Headquarters Battery, but completing survey does not demonstrate MET readiness or all five requirements.","sourceSlides":[36]},{"id":23,"difficulty":"medium","category":"FA System Elements and Responsibilities","tags":["organization","command and support relationships","FA platoon smallest deployable unit"],"prompt":"A Philippine Army classroom organization diagram establishes command and support relationships with a maneuver unit, but labels an element smaller than an FA platoon as the lesson's smallest deployable artillery support unit. The author argues that the relationships make the size label correct. Which review separates the two claims?","options":["Accept both claims because command relationships remove the lesson's minimum-unit statement.","Reject both claims because the lesson discusses unit size but gives relationships no role.","Keep the size label but remove the relationships because a smallest unit needs no relationship with maneuver forces.","Retain the relationship concept, but correct the minimum deployable support unit to an FA platoon."],"answer":3,"explanation":"Slide 35 connects command/support relationships with effective, economical delivery of fires and separately states that an FA platoon is the smallest artillery unit deployed to support maneuver units. One statement does not override the other.","sourceSlides":[35]},{"id":24,"difficulty":"medium","category":"Employment Tactics and Integrated Decisions","tags":["employment tactics","offensive positioning","defensive positioning","continuity of fires"],"prompt":"Two diagrams in a Philippine Army lesson review have swapped captions. The offensive diagram says 'rearward to preserve fires after enemy penetration'; the defensive diagram says 'well forward to support the attack and exploit range.' Which correction matches each rationale to its stated mission?","options":["Associate well-forward attack support with offense and rearward continuity after penetration with defense.","Keep both captions because continuity requires the same position regardless of the supported mission.","Use well-forward attack support for both because exploiting range is the sole employment consideration.","Use rearward continuity for both because the lesson does not distinguish offensive and defensive employment."],"answer":0,"explanation":"Slide 38 makes the supported unit's mission the basis of artillery employment. Its broad offensive pattern is well forward to support the attack and exploit range; its defensive pattern is rearward to maintain fires after penetration.","sourceSlides":[38]},{"id":25,"difficulty":"medium","category":"Employment Tactics and Integrated Decisions","tags":["fire direction and coordination","suitable weapon coverage","weapon/ammunition combinations","system"],"prompt":"A Philippine Army exercise review confirms correct call-for-fire conversion, but records unsuitable weapon coverage and an inappropriate weapon/ammunition combination. The summary declares the entire FA system effective because its 'brain' completed the conversion. Which revision best follows the lesson's division of responsibilities?","options":["Keep the summary because correct conversion is sufficient evidence that every functional element worked.","Credit conversion, but record gaps in fire coordination and weapon/ammunition selection that prevent the stated system-wide conclusion.","Reject the conversion result because unsuitable coverage proves no appropriate fire commands were produced.","Attribute both gaps to survey because weapon suitability and common location references are the same function."],"answer":1,"explanation":"Slide 32 describes a system of necessary functional elements. Slide 34 separates call conversion from coordination for suitable weapon coverage, and slide 35 links the right weapon/ammunition combination to effectiveness and efficiency. One completed function cannot establish the whole system's success.","sourceSlides":[32,34,35]}]</script>
