igade operation, artillery observers, sound-and-flash reports, and drone imagery flood the artillery net with target information. A planning cell must assign three duties in order: collecting target information as part of Headquarters and Headquarters Battery, serving as the principal unit in artillery intelligence, and converting observer calls for fire into fire commands. Which assignment follows the lesson?","options":["Target Acquisition Platoon; fire direction center; FA Regiment and FA Bn Intelligence Office","Signal Platoon; FA Regiment and FA Bn Intelligence Office; fire direction center","Target Acquisition Platoon; FA Regiment and FA Bn Intelligence Office; fire direction center","FA Regiment and FA Bn Intelligence Office; Target Acquisition Platoon; fire direction center"],"answer":2,"explanation":"Slide 33 places the Target Acquisition Platoon under Headquarters and Headquarters Battery as part of artillery target intelligence and names the Intelligence Office of the FA Regiment and FA Bn as the principal unit in artillery intelligence in large operations. Slide 34 makes the fire direction center responsible for converting the observer's call for fire into fire commands.","tags":["target acquisition","Target Acquisition Platoon","FA intelligence","FA Regiment and FA Bn intelligence office","observers and collectors","drones and vertical imagery","fire direction center","call-for-fire conversion","Headquarters and Headquarters Battery"],"sourceSlides":[33,34]},{"id":21,"difficulty":"hard","category":"FA System Elements and Responsibilities","prompt":"A Philippine Army observer calls for fire on an enemy platoon spread across an area wider than one gun can adequately cover. The nearest single gun could fire first; the full battery is farther away but within range; a second battery is beyond its specified range. Which fire-direction decision best reflects the lesson?","options":["Assign the nearest single gun, since the quickest response is what fire coordination seeks.","Convert the call into commands for the full battery, a group of weapons suited to cover the target.","Convert the call into commands for both batteries, since massing overrides the second battery's range limit.","Return the call to the observer, since converting a call into fire commands is the observer's responsibility."],"answer":1,"explanation":"Slide 34 makes the fire direction center responsible for converting the observer's call into fire commands and defines fire coordination as covering targets adequately with a suitable weapon or group of weapons. Slide 19 limits weapons to targets within their specified range, so the out-of-range battery cannot contribute.","tags":["fire direction center","call-for-fire conversion","fire direction and coordination","suitable weapon coverage","weapon range limits"],"sourceSlides":[19,34]},{"id":22,"difficulty":"hard","category":"FA System Elements and Responsibilities","prompt":"A Philippine Army battalion plans predicted night fires against targets that no observer can see. Its MET section in Headquarters and Headquarters Battery has current data, but the voice and digital radio link between the MET section and the fire direction center keeps failing. Which action best protects the accuracy of the planned fires?","options":["Restore reliable communication so the current MET data reach the fire direction center before firing.","Proceed on the survey grid alone, since survey and MET both belong to the same headquarters battery.","Proceed without MET data, since artillery can provide fires under all conditions of weather.","Have the Target Acquisition Platoon estimate MET data, since it is the eyes and ears of the system."],"answer":0,"explanation":"Slide 36 states that ballistic meteorological data are necessary for accurate fires and that MET information is one of five requirements for accurate predicted fires. Slide 37 ties effectiveness to reliable radio communication and places the Signal Platoon under Headquarters and Headquarters Battery; survey, the all-weather capability, and target acquisition each serve different purposes.","tags":["ballistic meteorology","meteorological data","five requirements for accurate predicted fires","communications","communications failure","radio and digital communications","Signal Platoon","Headquarters and Headquarters Battery","survey and MET accuracy"],"sourceSlides":[18,33,36,37]},{"id":23,"difficulty":"hard","category":"FA System Elements and Responsibilities","prompt":"A Philippine Army infantry company will hold a small outlying island for a week, and the brigade wants the smallest artillery commitment the lesson supports. The staff also debates whether the artillery needs any formal relationship with the company if it is simply located nearby. Which plan best matches the lesson?","options":["Send one gun section attached informally, since a single weapon is the easiest load for a landing craft.","Send an FA platoon with no set relationship, since being nearby is enough to coordinate its fires.","Send an FA platoon with an established command or support relationship to the company.","Send an FA battery under the company's command, since platoons are not deployed apart from their batteries."],"answer":2,"explanation":"Slide 35 states that an FA platoon is the smallest artillery unit deployed to provide fire support to maneuver units, and that establishing command and/or support relationships with maneuver units gives accurate fusion of indirect-fire capacities for effective, economical delivery of fires.","tags":["organization","FA platoon smallest deployable unit","command and support relationships","island movement"],"sourceSlides":[35]},{"id":24,"difficulty":"hard","category":"Employment Tactics and Integrated Decisions","prompt":"A Philippine Army brigade has seized its objective with its supporting artillery battalion positioned well forward. Intelligence now warns of a strong enemy counterattack that may penetrate the new line, and the brigade shifts to the defense. Which repositioning decision best follows the lesson?","options":["Stay well forward, since the battalion must keep exploiting its weapons' range against the counterattack.","Push farther forward to meet the counterattack at depth before it reaches the brigade's new line.","Hold the current positions, since the battalion can shift and mass fires without repositioning.","Reposition toward the rear, so the battalion's fires can continue if the enemy penetrates the line."],"answer":3,"explanation":"Slide 38 makes the supported unit's mission the basis of artillery employment: forward positions suit the offense, while in the defense the supporting unit is positioned at the rear to ensure continuity of fires in the event of enemy penetration. Slide 18's ability to shift fires without displacing does not change that defensive requirement.","tags":["employment tactics","offensive positioning","defensive positioning","continuity of fires","rapid shifting and massing"],"sourceSlides":[18,38]},{"id":25,"difficulty":"hard","category":"Employment Tactics and Integrated Decisions","prompt":"A Philippine Army brigade launches an attack deep across a fictional province. The supporting battery commander, citing artillery's limited self-defense and detectable firing signature, proposes staying in rear positions throughout the attack, although the lead units will soon move beyond the battery's range from those positions. Which decision best integrates the lesson?","options":["Stay in the rear, since rearward positions are what protect the continuity of fires.","Position well forward to support the attack and exploit range, displacing judiciously to limit exposure.","Stay in the rear and mass fires on nearer targets, since massing makes up for the lost range.","Move forward only after the attack ends, since firing during the advance would reveal the battery's signature."],"answer":1,"explanation":"Slide 38 states that the supported unit's mission dictates employment and that in the offense artillery is positioned well forward to support the attack and exploit the range of its weapons. Slide 19's self-defense and signature limitations are real, but slide 18's continuous support by judicious displacement manages exposure without abandoning the attack; rear positioning is the defensive pattern, and slide 19 limits fires to specified range.","tags":["employment tactics","offensive positioning","limited self-defense","detectable firing signature","counterfire exposure","continuous support by judicious displacement","weapon range limits","maneuver timing"],"sourceSlides":[18,19,38]}]</script>
